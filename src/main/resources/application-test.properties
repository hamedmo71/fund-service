# ========================================
# Database
# ========================================

db.url=jdbc:mysql://localhost:3306/family_fund_test?useSSL=false&serverTimezone=Asia/Tehran&characterEncoding=UTF-8
db.username=root
db.password=H@med@71

# ========================================
# HikariCP
# ========================================

db.pool.maximum-size=10
db.pool.minimum-idle=2
db.pool.connection-timeout=30000
db.pool.idle-timeout=600000
db.pool.max-lifetime=1800000

# ========================================
# JPA / Hibernate
# ========================================

jpa.show-sql=false
jpa.format-sql=true
jpa.hibernate.ddl-auto=validate

# ========================================
# Flyway
# ========================================

flyway.enabled=true
flyway.locations=classpath:db/migration
flyway.baseline-on-migrate=true